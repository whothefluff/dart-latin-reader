name: Flutter Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  common:
    uses: ./.github/workflows/common.yml
    with:
      runner: windows-latest

  database:
    uses: ./.github/workflows/database.yml

  windows-specific-steps:
    needs: [common, database]
    runs-on: windows-2022 # TODO(whothefluff): change back to 'windows-latest' after upgrading flutter
    if: ${{ !cancelled() }}
    timeout-minutes: 45

    steps:

    - name: Require static checks and database
      if: ${{ needs.common.result != 'success' || needs.database.result != 'success' }}
      run: exit 1

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version-file: pubspec.yaml
        cache: true
        pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('**/pubspec.lock') }}"

    - name: Install dependencies
      run: flutter pub get

    - name: Download database
      uses: actions/download-artifact@v4
      with:
        name: latin-reader-database-${{ github.run_number }}
        path: build/generated_database

    - name: Stage database and exclude CSV assets
      run: |
        Copy-Item build/generated_database/data.db assets/preprocessed_data/data.db
        Remove-Item assets/preprocessed_data/*.csv

    - name: Build Windows app
      run: |
        $databaseHash = (Get-FileHash build/generated_database/data.db -Algorithm SHA256).Hash.ToLowerInvariant()
        flutter build windows --release "--dart-define=BUNDLED_DATABASE_ID=$databaseHash"

    - name: Verify packaged database and absence of CSVs
      run: |
        $release = 'build/windows/x64/runner/Release'
        $assets = "$release/data/flutter_assets/assets/preprocessed_data"

        if ((Get-FileHash "$assets/data.db").Hash -ne (Get-FileHash build/generated_database/data.db).Hash) {
          throw 'The Windows build does not contain the generated database.'
        }
        if ((Get-FileHash "$assets/data_version.txt").Hash -ne (Get-FileHash assets/preprocessed_data/data_version.txt).Hash) {
          throw 'The Windows build contains the wrong data version.'
        }
        if (Get-ChildItem $release -Recurse -File -Filter *.csv) {
          throw 'The Windows build still contains CSV files.'
        }

        'Verified database asset; no CSV files packaged.'

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: latin-reader-windows-${{ github.run_number }}
        path: build/windows/x64/runner/Release/
        if-no-files-found: error

  publish-preview:
    if: ${{ github.repository == 'whothefluff/dart-latin-reader' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: windows-specific-steps
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

    - name: Download Windows build
      uses: actions/download-artifact@v4
      with:
        name: latin-reader-windows-${{ github.run_number }}
        path: latin_reader

    - name: Publish rolling Windows preview
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        zip -qr latin-reader-windows.zip latin_reader

        printf 'Commit: %s\n\nBuild: %s/%s/actions/runs/%s\n' \
          "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
          > release-notes.md

        if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/windows-preview" > /dev/null 2>&1; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/windows-preview" \
            -f sha="$GITHUB_SHA" -F force=true > /dev/null
        else
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref=refs/tags/windows-preview -f sha="$GITHUB_SHA" > /dev/null
        fi

        if gh release view windows-preview --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          gh release upload windows-preview latin-reader-windows.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit windows-preview --repo "$GITHUB_REPOSITORY" \
            --title "Latest Windows preview" --notes-file release-notes.md \
            --prerelease --latest=false
        else
          gh release create windows-preview latin-reader-windows.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Latest Windows preview" --notes-file release-notes.md \
            --prerelease --latest=false
        fi