name: macOS

on:
  workflow_call:
    inputs:
      database-sha256:
        required: true
        type: string
      data-version:
        required: true
        type: string

jobs:
  build:
    name: Build
    runs-on: macos-15 # TODO(whothefluff): consider 'macos-latest' after upgrading flutter; newer images ship a newer Xcode
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      built-at: ${{ steps.build.outputs.built-at }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('**/pubspec.lock') }}"

      - name: Install dependencies
        run: flutter pub get

      - name: Stage database
        uses: ./.github/actions/stage-database

      - name: Build macOS app
        id: build
        env:
          DATABASE_SHA256: ${{ inputs.database-sha256 }}
        run: |
          flutter build macos --release --dart-define=BUNDLED_DATABASE_ID="$DATABASE_SHA256"
          printf 'built-at=%s\n' "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Verify packaged database and absence of CSVs
        run: bash .github/scripts/verify-bundled-database.sh build/macos/Build/Products/Release/latin_reader.app

      # ditto keeps the app's symlinks, permissions and ad-hoc signature, which artifact ZIPs drop
      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/latin_reader.app latin-reader-macos.zip

      - name: Upload macOS app
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latin-reader-macos-${{ github.run_number }}
          path: latin-reader-macos.zip
          if-no-files-found: error

  publish:
    name: Publish preview
    if: ${{ github.repository == 'whothefluff/dart-latin-reader' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout publishing action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/actions

      - name: Download macOS app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latin-reader-macos-${{ github.run_number }}
          path: preview

      - name: Download database
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: latin-reader-database-${{ github.run_number }}
          path: preview

      - name: Publish rolling macOS preview
        uses: ./.github/actions/publish-preview
        with:
          tag: macos-preview
          title: Latest macOS preview
          files: |
            preview/latin-reader-macos.zip
            preview/data.db
          built-at: ${{ needs.build.outputs.built-at }}
          data-version: ${{ inputs.data-version }}
          database-sha256: ${{ inputs.database-sha256 }}
