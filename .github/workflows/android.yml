name: Flutter Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  common:
    uses: ./.github/workflows/common.yml
    with:
      runner: ubuntu-latest

  android-specific-steps:
    runs-on: ubuntu-latest
    needs: common
    if: ${{ !cancelled() }}
    timeout-minutes: 45

    env:
      ANDROID_CI_BUILD: "true"

    steps:
      - name: Require static checks
        if: ${{ needs.common.result != 'success' }}
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('**/pubspec.lock') }}"

      - name: Install SQLite for database generation
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate and validate database
        run: flutter test tool/build_database_test.dart --reporter expanded --timeout none

      - name: Stage database and exclude CSV assets
        run: |
          cp build/generated_database/data.db assets/preprocessed_data/data.db
          rm assets/preprocessed_data/*.csv

      - name: Restore test signing key
        if: ${{ github.event_name != 'pull_request' && github.repository == 'whothefluff/dart-latin-reader' }}
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          : "${ANDROID_TEST_KEYSTORE_BASE64:?Set the ANDROID_TEST_KEYSTORE_BASE64 repository secret.}"
          : "${ANDROID_TEST_KEYSTORE_PASSWORD:?Set the ANDROID_TEST_KEYSTORE_PASSWORD repository secret.}"
          umask 077
          printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/latin-reader-test.jks"
          keytool -list -keystore "$RUNNER_TEMP/latin-reader-test.jks" \
            -storepass:env ANDROID_TEST_KEYSTORE_PASSWORD -alias latin-reader-test > /dev/null
          printf 'ANDROID_TEST_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/latin-reader-test.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_TEST_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_TEST_KEYSTORE_PASSWORD || '' }}
        run: |
          database_hash="$(sha256sum build/generated_database/data.db | cut -d ' ' -f 1)"
          flutter build apk --release \
            --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=BUNDLED_DATABASE_ID="$database_hash"

      - name: Verify packaged database and absence of CSVs
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile

          database = Path("build/generated_database/data.db")
          expected_hash = hashlib.sha256(database.read_bytes()).digest()
          apk_path = Path("build/app/outputs/flutter-apk/app-release.apk")
          prefix = "assets/flutter_assets/assets/preprocessed_data/"

          with ZipFile(apk_path) as apk:
              actual_hash = hashlib.sha256(apk.read(prefix + "data.db")).digest()
              if actual_hash != expected_hash:
                  raise SystemExit("The APK does not contain the generated database.")

              if any(name.lower().endswith(".csv") for name in apk.namelist()):
                  raise SystemExit("The APK still contains CSV files.")

              version = Path("assets/preprocessed_data/data_version.txt").read_bytes()
              if apk.read(prefix + "data_version.txt") != version:
                  raise SystemExit("The APK contains the wrong data version.")

          print("Verified database asset; no CSV files packaged.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: latin-reader-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Remove temporary signing key
        if: ${{ always() && github.event_name != 'pull_request' }}
        run: rm -f "$RUNNER_TEMP/latin-reader-test.jks"

  publish-preview:
    if: ${{ github.repository == 'whothefluff/dart-latin-reader' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: android-specific-steps
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: latin-reader-apk-${{ github.run_number }}
          path: apk

      - name: Publish rolling Android preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Commit: %s\n\nBuild: %s/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            > release-notes.md

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/android-preview" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/android-preview" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/tags/android-preview -f sha="$GITHUB_SHA" > /dev/null
          fi

          if gh release view android-preview --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload android-preview apk/app-release.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit android-preview --repo "$GITHUB_REPOSITORY" \
              --title "Latest Android preview" --notes-file release-notes.md \
              --prerelease --latest=false
          else
            gh release create android-preview apk/app-release.apk \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Latest Android preview" --notes-file release-notes.md \
              --prerelease --latest=false
          fi
