name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Checks and the database run once per run; each platform's file then builds and publishes it.
jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('**/pubspec.lock') }}"

      - run: flutter --version # Print the Flutter version for debugging purposes

      - name: Install dependencies
        run: flutter pub get

      - name: Check for Outdated Dependencies
        run: flutter pub outdated

      - name: Run Flutter Analyze
        run: flutter analyze

      - name: Run Unit Tests
        run: flutter test

  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.describe.outputs.sha256 }}
      data-version: ${{ steps.describe.outputs.data-version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('**/pubspec.lock') }}"

      - name: Install SQLite for database generation
        run: |
          sudo apt-get update
          sudo apt-get install --yes libsqlite3-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Generate and validate database
        run: flutter test tool/build_database_test.dart --reporter expanded --timeout none

      - name: Describe database
        id: describe
        run: |
          printf 'sha256=%s\n' "$(sha256sum build/generated_database/data.db | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          printf 'data-version=%s\n' "$(tr -d '[:space:]' < assets/preprocessed_data/data_version.txt)" >> "$GITHUB_OUTPUT"

      - name: Upload database
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latin-reader-database-${{ github.run_number }}
          path: build/generated_database/data.db
          if-no-files-found: error
          # Pull requests only need it for their own builds; 0 keeps the repository default
          retention-days: ${{ github.event_name == 'pull_request' && 1 || 0 }}

  # Each platform needs the checks too, because its publish job must wait for them
  android:
    name: Android
    needs: [checks, database]
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      database-sha256: ${{ needs.database.outputs.sha256 }}
      data-version: ${{ needs.database.outputs.data-version }}
    secrets:
      ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
      ANDROID_TEST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}

  windows:
    name: Windows
    needs: [checks, database]
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      database-sha256: ${{ needs.database.outputs.sha256 }}
      data-version: ${{ needs.database.outputs.data-version }}

  linux:
    name: Linux
    needs: [checks, database]
    permissions:
      contents: write
    uses: ./.github/workflows/linux.yml
    with:
      database-sha256: ${{ needs.database.outputs.sha256 }}
      data-version: ${{ needs.database.outputs.data-version }}

  macos:
    name: macOS
    needs: [checks, database]
    permissions:
      contents: write
    uses: ./.github/workflows/macos.yml
    with:
      database-sha256: ${{ needs.database.outputs.sha256 }}
      data-version: ${{ needs.database.outputs.data-version }}

  ios:
    name: iOS
    needs: [checks, database]
    permissions:
      contents: write
    uses: ./.github/workflows/ios.yml
    with:
      database-sha256: ${{ needs.database.outputs.sha256 }}
      data-version: ${{ needs.database.outputs.data-version }}
