version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/" # Location of pubspec.yaml file
    schedule:
      interval: "monthly"
  - package-ecosystem: "github-actions"
    directories:
      - "/" # Workflows in .github/workflows
      - "/.github/actions/*" # Composite actions, which pin actions too
    schedule:
      interval: "monthly"
